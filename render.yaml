# Render Blueprint — https://render.com
# Dashboard: New → Blueprint → connect WejdanBa-CS/Givy
services:
  - type: web
    name: givy
    runtime: node
    plan: free
    region: oregon
    branch: master
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_SITE_URL
        value: https://www.givy.gifts
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: NEXT_PUBLIC_BETA_REQUIRE_INVITE
        value: "true"

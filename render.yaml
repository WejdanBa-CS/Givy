# Render Blueprint — https://render.com
# Dashboard: New → Blueprint → connect WejdanBa-CS/Givy
#
# `givy` is production. `givy-staging` deploys the protected `staging` branch
# against a separate Supabase project. Never copy production database or secret
# values into the staging service.
services:
  - type: web
    name: givy
    runtime: node
    plan: free
    region: oregon
    branch: master
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_SITE_URL
        value: https://www.givy.gifts
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      # Public launch — invite gate off (also run supabase/ops/open_public_signup.sql)
      - key: NEXT_PUBLIC_BETA_REQUIRE_INVITE
        value: "false"
      - key: NEXT_PUBLIC_ALLOW_GUEST
        value: "false"
      - key: NEXT_PUBLIC_SENTRY_DSN
        sync: false
      - key: NEXT_PUBLIC_SENTRY_ENVIRONMENT
        value: production
      # Skimlinks — leave unset/false until publisher domain is approved
      - key: NEXT_PUBLIC_SKIMLINKS_PUBLISHER_ID
        sync: false
      - key: NEXT_PUBLIC_SKIMLINKS_ENABLED
        value: "false"
      # v2 friend-event reminders (set in dashboard when launching social calendar)
      - key: CRON_SECRET
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FCM_SERVER_KEY
        sync: false

  - type: web
    name: givy-staging
    runtime: node
    plan: free
    region: oregon
    branch: staging
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_SITE_URL
        value: https://givy-staging.onrender.com
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: NEXT_PUBLIC_BETA_REQUIRE_INVITE
        value: "true"
      - key: NEXT_PUBLIC_ALLOW_GUEST
        value: "false"
      - key: NEXT_PUBLIC_SENTRY_DSN
        sync: false
      - key: NEXT_PUBLIC_SENTRY_ENVIRONMENT
        value: staging
      - key: CRON_SECRET
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FCM_SERVER_KEY
        sync: false

  # Optional: daily reminder ping (requires a paid cron-capable plan on Render).
  # Prefer GitHub Actions workflow `.github/workflows/event-reminders-cron.yml`
  # on free tiers — enable secrets only after SQL 015–017 are applied.
